<?xml version="1.0" encoding="UTF-8"?>
<!--
  Configraft 系统架构图
  配色对齐 web/style.css 浅色简洁风:bg #f5f6f8 / panel #ffffff / border #e4e7ec /
  text #1f2937 / text-dim #667085 / accent #2563eb / green #16a34a / red #dc2626 /
  amber #d97706。
  层级色带:API 蓝 #2563eb · Raft 靛 #4f46e5 · 状态机青 #0891b2 · 存储琥珀 #d97706。
  箭头全部手画(<use> 引用三角路径),不依赖 marker,保证各渲染器对齐一致。
  修改布局时,主要改各 g id 分组内的坐标即可;可在 draw.io 等工具中打开编辑。
-->
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="980" viewBox="0 0 1280 980" font-family="&quot;Segoe UI&quot;, &quot;PingFang SC&quot;, &quot;Microsoft YaHei&quot;, -apple-system, sans-serif">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#101828" flood-opacity="0.05"/>
    </filter>
    <!-- 手画箭头三角:use 的 (x,y) 即箭头尖端;tri-l 尖朝左、tri-r 尖朝右 -->
    <path id="tri-dn" d="M-4,-7 L4,-7 L0,0 Z" fill="#8a94a6"/>
    <path id="tri-l"  d="M0,0 L7,-4 L7,4 Z" fill="#8a94a6"/>
    <path id="tri-r"  d="M0,0 L-7,-4 L-7,4 Z" fill="#8a94a6"/>
    <style>
      .t-main   { font-size: 18px; font-weight: 600; fill: #1f2937; }
      .t-sec    { font-size: 13px; font-weight: 600; fill: #1f2937; }
      .t-dim    { font-size: 12px; fill: #667085; }
      .l-name   { font-size: 13px; font-weight: 600; fill: #1f2937; }
      .l-sub    { font-size: 11px; fill: #667085; }
      .mono     { font-family: Consolas, "SF Mono", "JetBrains Mono", "Cascadia Code", monospace; }
      .node-name{ font-size: 14px; font-weight: 600; fill: #1f2937; font-family: Consolas, "SF Mono", "JetBrains Mono", "Cascadia Code", monospace; }
      .badge    { font-size: 10.5px; font-weight: 700; letter-spacing: 0.4px; }
      .step     { font-size: 11px; fill: #475467; font-family: Consolas, "SF Mono", "JetBrains Mono", "Cascadia Code", monospace; }
      .axis     { font-size: 10px; fill: #8a94a6; }
    </style>
  </defs>

  <!-- 背景 -->
  <rect x="0" y="0" width="1280" height="980" fill="#f5f6f8"/>

  <!-- ============ 标题 ============ -->
  <text x="40" y="26" class="t-main">Configraft 系统架构</text>
  <text x="40" y="44" class="t-dim" style="letter-spacing:0.2px">基于 Raft 共识的分布式配置中心 · C++17 / braft / brpc / LevelDB</text>

  <!-- ============ ① 客户端 / SDK 层 ============ -->
  <g id="client-layer">
    <rect x="40" y="58" width="1200" height="104" rx="10" fill="#ffffff" stroke="#e4e7ec" filter="url(#shadow)"/>
    <text x="64" y="86" class="t-sec">客户端 / SDK(跨语言)</text>

    <!-- gRPC -->
    <rect x="64" y="94" width="273" height="56" rx="6" fill="#fafbfc" stroke="#e4e7ec"/>
    <rect x="70" y="94" width="261" height="5" rx="2.5" fill="#64748b"/>
    <text x="80" y="124" class="l-name">gRPC(HTTP/2)</text>
    <text x="80" y="142" class="l-sub">KV / Config / Admin 读写</text>

    <!-- HTTP RESTful -->
    <rect x="357" y="94" width="273" height="56" rx="6" fill="#fafbfc" stroke="#e4e7ec"/>
    <rect x="363" y="94" width="261" height="5" rx="2.5" fill="#64748b"/>
    <text x="373" y="124" class="l-name">HTTP RESTful</text>
    <text x="373" y="142" class="l-sub">Publish · Rollback · CAS</text>

    <!-- HTTP Watch -->
    <rect x="650" y="94" width="273" height="56" rx="6" fill="#fafbfc" stroke="#e4e7ec"/>
    <rect x="656" y="94" width="261" height="5" rx="2.5" fill="#64748b"/>
    <text x="666" y="124" class="l-name">HTTP 长轮询 Watch</text>
    <text x="666" y="142" class="l-sub">变更事件实时推送</text>

    <!-- Web Dashboard -->
    <rect x="943" y="94" width="273" height="56" rx="6" fill="#fafbfc" stroke="#e4e7ec"/>
    <rect x="949" y="94" width="261" height="5" rx="2.5" fill="#64748b"/>
    <text x="959" y="124" class="l-name">Web Dashboard</text>
    <text x="959" y="142" class="l-sub">浏览器可视化管理</text>
  </g>

  <!-- ============ 接入协议 ============ -->
  <g id="protocol-gateway">
    <line x1="640" y1="162" x2="640" y2="185" stroke="#8a94a6" stroke-width="1.5"/>
    <use href="#tri-dn" x="640" y="192"/>
    <text x="656" y="181" class="t-dim">brpc 单端口多协议 · 8001/8002/8003 · gRPC + HTTP + Raft 内部通信</text>
  </g>

  <!-- ============ ② 集群层(3 节点 Raft)============ -->
  <g id="cluster">
    <rect x="40" y="192" width="1200" height="608" rx="10" fill="#ffffff" stroke="#d0d5dd" stroke-width="1.5" filter="url(#shadow)"/>
    <text x="64" y="218" class="t-sec">Configraft 集群 · 3 节点 Raft(braft)</text>
    <text x="1206" y="218" class="t-dim" text-anchor="end">容错:容忍 1 节点宕机</text>
    <line x1="64" y1="230" x2="1216" y2="230" stroke="#eef0f3" stroke-width="1"/>

    <!-- ===== Follower node2 ===== -->
    <g id="node-follower-1">
      <rect x="74" y="262" width="270" height="470" rx="8" fill="#ffffff" stroke="#e4e7ec" filter="url(#shadow)"/>
      <text x="92" y="290" class="node-name">node2</text>
      <rect x="240" y="272" width="88" height="22" rx="11" fill="#eef0f3"/>
      <text x="284" y="287" class="badge" fill="#475467" text-anchor="middle">FOLLOWER</text>

      <!-- Raft 层 -->
      <g id="f1-raft">
        <rect x="92" y="330" width="234" height="64" rx="6" fill="#ffffff" stroke="#d0d5dd"/>
        <rect x="98" y="330" width="222" height="6" rx="3" fill="#4f46e5"/>
        <text x="106" y="358" class="l-name">Raft 层(braft)</text>
        <text x="106" y="378" class="l-sub">日志复制 · 心跳 · 快照</text>
      </g>
      <line x1="209" y1="394" x2="209" y2="401" stroke="#8a94a6" stroke-width="1.5"/>
      <use href="#tri-dn" x="209" y="408"/>

      <!-- 复制状态机 -->
      <g id="f1-smm">
        <rect x="92" y="414" width="234" height="64" rx="6" fill="#ffffff" stroke="#d0d5dd"/>
        <rect x="98" y="414" width="222" height="6" rx="3" fill="#0891b2"/>
        <text x="106" y="442" class="l-name">复制状态机</text>
        <text x="106" y="462" class="l-sub">on_apply(串行)与 Leader 一致</text>
      </g>
      <line x1="209" y1="478" x2="209" y2="485" stroke="#8a94a6" stroke-width="1.5"/>
      <use href="#tri-dn" x="209" y="492"/>

      <!-- 存储层 -->
      <g id="f1-store">
        <rect x="92" y="498" width="234" height="64" rx="6" fill="#ffffff" stroke="#d0d5dd"/>
        <rect x="98" y="498" width="222" height="6" rx="3" fill="#d97706"/>
        <text x="106" y="526" class="l-name">存储层 LevelDB</text>
        <text x="106" y="546" class="l-sub">k/ · v/ · cfg/ · meta 索引</text>
      </g>
    </g>

    <!-- ===== Leader node1(内部展开)===== -->
    <g id="node-leader">
      <rect x="420" y="242" width="440" height="510" rx="8" fill="#eef4ff" stroke="#2563eb" stroke-width="2" filter="url(#shadow)"/>
      <text x="440" y="272" class="node-name">node1</text>
      <rect x="758" y="254" width="88" height="22" rx="11" fill="#2563eb"/>
      <text x="802" y="269" class="badge" fill="#ffffff" text-anchor="middle">LEADER</text>

      <!-- API 服务层 -->
      <g id="l1-api">
        <rect x="440" y="300" width="400" height="72" rx="6" fill="#ffffff" stroke="#d0d5dd"/>
        <rect x="448" y="300" width="384" height="6" rx="3" fill="#2563eb"/>
        <text x="456" y="332" class="l-name">API 服务层(brpc Server)</text>
        <text x="456" y="353" class="l-sub">KVService · ConfigService · WatchService · AdminService · Dashboard</text>
      </g>
      <line x1="640" y1="372" x2="640" y2="379" stroke="#8a94a6" stroke-width="1.5"/>
      <use href="#tri-dn" x="640" y="386"/>

      <!-- Raft 层 -->
      <g id="l1-raft">
        <rect x="440" y="394" width="400" height="72" rx="6" fill="#ffffff" stroke="#d0d5dd"/>
        <rect x="448" y="394" width="384" height="6" rx="3" fill="#4f46e5"/>
        <text x="456" y="426" class="l-name">Raft 层(braft)</text>
        <text x="456" y="447" class="l-sub">选主 · 日志复制 · Leader Lease 线性一致读 · 成员变更</text>
      </g>
      <line x1="640" y1="466" x2="640" y2="473" stroke="#8a94a6" stroke-width="1.5"/>
      <use href="#tri-dn" x="640" y="480"/>

      <!-- 复制状态机 -->
      <g id="l1-smm">
        <rect x="440" y="488" width="400" height="72" rx="6" fill="#ffffff" stroke="#d0d5dd"/>
        <rect x="448" y="488" width="384" height="6" rx="3" fill="#0891b2"/>
        <text x="456" y="520" class="l-name">复制状态机(on_apply 串行)</text>
        <text x="456" y="541" class="l-sub">MVCC 写入 · CAS 原子 · Watch 事件 · Compaction</text>
      </g>
      <line x1="640" y1="560" x2="640" y2="567" stroke="#8a94a6" stroke-width="1.5"/>
      <use href="#tri-dn" x="640" y="574"/>

      <!-- 存储层 -->
      <g id="l1-store">
        <rect x="440" y="582" width="400" height="72" rx="6" fill="#ffffff" stroke="#d0d5dd"/>
        <rect x="448" y="582" width="384" height="6" rx="3" fill="#d97706"/>
        <text x="456" y="614" class="l-name">存储层 LevelDB</text>
        <text x="456" y="635" class="l-sub">k/ 主数据 · v/ 历史 · cfg/ 版本 · meta/revision 全局时钟</text>
      </g>
    </g>

    <!-- ===== Follower node3 ===== -->
    <g id="node-follower-2">
      <rect x="936" y="262" width="270" height="470" rx="8" fill="#ffffff" stroke="#e4e7ec" filter="url(#shadow)"/>
      <text x="954" y="290" class="node-name">node3</text>
      <rect x="1102" y="272" width="88" height="22" rx="11" fill="#eef0f3"/>
      <text x="1146" y="287" class="badge" fill="#475467" text-anchor="middle">FOLLOWER</text>

      <g id="f3-raft">
        <rect x="954" y="330" width="234" height="64" rx="6" fill="#ffffff" stroke="#d0d5dd"/>
        <rect x="960" y="330" width="222" height="6" rx="3" fill="#4f46e5"/>
        <text x="968" y="358" class="l-name">Raft 层(braft)</text>
        <text x="968" y="378" class="l-sub">日志复制 · 心跳 · 快照</text>
      </g>
      <line x1="1071" y1="394" x2="1071" y2="401" stroke="#8a94a6" stroke-width="1.5"/>
      <use href="#tri-dn" x="1071" y="408"/>

      <g id="f3-smm">
        <rect x="954" y="414" width="234" height="64" rx="6" fill="#ffffff" stroke="#d0d5dd"/>
        <rect x="960" y="414" width="222" height="6" rx="3" fill="#0891b2"/>
        <text x="968" y="442" class="l-name">复制状态机</text>
        <text x="968" y="462" class="l-sub">on_apply(串行)与 Leader 一致</text>
      </g>
      <line x1="1071" y1="478" x2="1071" y2="485" stroke="#8a94a6" stroke-width="1.5"/>
      <use href="#tri-dn" x="1071" y="492"/>

      <g id="f3-store">
        <rect x="954" y="498" width="234" height="64" rx="6" fill="#ffffff" stroke="#d0d5dd"/>
        <rect x="960" y="498" width="222" height="6" rx="3" fill="#d97706"/>
        <text x="968" y="526" class="l-name">存储层 LevelDB</text>
        <text x="968" y="546" class="l-sub">k/ · v/ · cfg/ · meta 索引</text>
      </g>
    </g>

    <!-- ===== 节点间复制 / 心跳(手画双向箭头)===== -->
    <g id="replication">
      <!-- Leader ↔ node2 -->
      <line x1="358" y1="497" x2="406" y2="497" stroke="#8a94a6" stroke-width="1.5"/>
      <use href="#tri-l" x="352" y="497"/>
      <use href="#tri-r" x="414" y="497"/>
      <text x="382" y="517" class="axis" text-anchor="middle">日志复制</text>
      <!-- Leader ↔ node3 -->
      <line x1="870" y1="497" x2="918" y2="497" stroke="#8a94a6" stroke-width="1.5"/>
      <use href="#tri-l" x="864" y="497"/>
      <use href="#tri-r" x="926" y="497"/>
      <text x="894" y="517" class="axis" text-anchor="middle">日志复制</text>
    </g>

    <!-- 集群容器底部说明 -->
    <text x="640" y="780" class="t-dim" text-anchor="middle">写请求必须到达 Leader(非 Leader 返回重定向);读默认 Leader Lease 线性一致,可降级 Follower 本地读</text>
  </g>

  <!-- ============ ③ 关键数据流与容错 ============ -->
  <g id="flows">
    <text x="40" y="832" class="t-sec">关键数据流与容错</text>

    <!-- 写 -->
    <g id="flow-write">
      <rect x="40" y="844" width="288" height="120" rx="6" fill="#ffffff" stroke="#e4e7ec" filter="url(#shadow)"/>
      <rect x="40" y="844" width="5" height="120" fill="#dc2626"/>
      <text x="62" y="871" class="l-name">写路径 · 必经 Leader</text>
      <text x="62" y="896" class="step">客户端 → Leader · apply(task)</text>
      <text x="62" y="916" class="step">→ Raft 复制到多数派 · commit</text>
      <text x="62" y="936" class="step">→ on_apply 串行写 LevelDB → 返回</text>
    </g>

    <!-- 读 -->
    <g id="flow-read">
      <rect x="344" y="844" width="288" height="120" rx="6" fill="#ffffff" stroke="#e4e7ec" filter="url(#shadow)"/>
      <rect x="344" y="844" width="5" height="120" fill="#2563eb"/>
      <text x="366" y="871" class="l-name">读路径 · 线性一致</text>
      <text x="366" y="896" class="step">客户端 → Leader · Get</text>
      <text x="366" y="916" class="step">→ Leader Lease 校验 + applied≥commit</text>
      <text x="366" y="936" class="step">→ 本地状态机读取 → 返回</text>
    </g>

    <!-- Watch -->
    <g id="flow-watch">
      <rect x="648" y="844" width="288" height="120" rx="6" fill="#ffffff" stroke="#e4e7ec" filter="url(#shadow)"/>
      <rect x="648" y="844" width="5" height="120" fill="#16a34a"/>
      <text x="670" y="871" class="l-name">Watch · 实时推送</text>
      <text x="670" y="896" class="step">客户端长轮询 from_revision</text>
      <text x="670" y="916" class="step">→ 挂起 · on_apply 产生事件</text>
      <text x="670" y="936" class="step">→ 立即推送 · 新 revision 续传</text>
    </g>

    <!-- 故障转移 -->
    <g id="flow-failover">
      <rect x="952" y="844" width="288" height="120" rx="6" fill="#ffffff" stroke="#e4e7ec" filter="url(#shadow)"/>
      <rect x="952" y="844" width="5" height="120" fill="#d97706"/>
      <text x="974" y="871" class="l-name">故障转移 · 自动选主</text>
      <text x="974" y="896" class="step">Leader 宕机 · 心跳超时</text>
      <text x="974" y="916" class="step">→ 发起选举 · 多数派认可</text>
      <text x="974" y="936" class="step">→ 新 Leader 接管 · 数秒恢复</text>
    </g>
  </g>
</svg>
